name: Release Linux

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os-label: ubuntu22
          - os: ubuntu-24.04
            os-label: ubuntu24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            protobuf-compiler

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/linux/src-tauri -> target"
          key: ${{ matrix.os }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux release
        run: pnpm build:linux
        env:
          CI: true

      - name: Rename artifacts with OS label
        id: artifacts
        run: |
          BUNDLE=apps/linux/src-tauri/target/release/bundle
          LABEL="${{ matrix.os-label }}"

          # AppImage
          SRC_APPIMAGE=$(ls "$BUNDLE"/appimage/*.AppImage | head -1)
          BASE=$(basename "$SRC_APPIMAGE" .AppImage)
          DST_APPIMAGE="$BUNDLE/appimage/${BASE}-${LABEL}.AppImage"
          mv "$SRC_APPIMAGE" "$DST_APPIMAGE"

          # .deb
          SRC_DEB=$(ls "$BUNDLE"/deb/*.deb | head -1)
          BASE=$(basename "$SRC_DEB" .deb)
          DST_DEB="$BUNDLE/deb/${BASE}-${LABEL}.deb"
          mv "$SRC_DEB" "$DST_DEB"

          # .rpm
          SRC_RPM=$(ls "$BUNDLE"/rpm/*.rpm | head -1)
          BASE=$(basename "$SRC_RPM" .rpm)
          DST_RPM="$BUNDLE/rpm/${BASE}-${LABEL}.rpm"
          mv "$SRC_RPM" "$DST_RPM"

          echo "appimage=$DST_APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb=$DST_DEB" >> "$GITHUB_OUTPUT"
          echo "rpm=$DST_RPM" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.rpm }}
          generate_release_notes: true
