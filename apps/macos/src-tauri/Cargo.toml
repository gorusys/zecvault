[package]
name = "app"
version = "0.1.5"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
bip39 = { version = "2.2.0", features = ["rand"] }
zcash_keys = { version = "0.13.0", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "0.8.0"
zip32 = "0.2.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
argon2 = "0.5"
aes-gcm = "0.10"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
rand = "0.8"
log = "0.4"
tauri = { version = "2.10.3", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
zcash_client_sqlite = { version = "0.20.0", features = ["orchard"] }
zcash_client_backend = { version = "0.22.0", features = ["orchard", "sync", "lightwalletd-tonic", "lightwalletd-tonic-transport"] }
zcash_proofs = { version = "0.27.0", features = ["bundled-prover"] }
secrecy = "0.8"
async-trait = "0.1.89"
